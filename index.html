<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B-Forms • Dynamic Form & Survey Engine | Buildicy</title>
  <meta name="description" content="B-Forms is a lightweight, mobile-optimized feedback and survey engine built with Buildicy. Create custom feedback forms, share links, and inspect real-time responses." />
  <meta name="theme-color" content="#7c3aed" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('bforms_theme') || 'light';
        if (saved === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
<body class="bg-[#050507] text-white antialiased selection:bg-purple-600 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
